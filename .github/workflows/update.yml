name: 每日更新台股籌碼

on:
  schedule:
    # 台北時間平日 21:17 起每 30 分鐘抓一次到 23:47，凌晨 01:17、早上 07:17 再補。
    # GitHub 排程常會延遲，多排幾次可以提高當晚就更新的機會；資料已完整的那次會很快跳過。
    - cron: "17,47 13-15 * * 1-5"
    - cron: "17 17 * * 1-5"
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "回補最近幾個平日（第一次建議 60）"
        default: "1"
      force_est:
        description: "立即重抓分析師預估 EPS（平常每週自動一次）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "scripts/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-chips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests yfinance

      - name: 抓資料
        if: github.event_name != 'push'
        run: python scripts/fetch.py --days "${{ github.event.inputs.days || '3' }}"

      - name: 月底本益比（3 年）
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/pe_history.py

      - name: 分析師預估 EPS（每週）
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/estimates.py ${{ github.event.inputs.force_est == 'true' && '--force' || '' }}

      - name: 存回 repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git push

      - name: 建置網站
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
