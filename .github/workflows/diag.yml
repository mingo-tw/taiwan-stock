name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - name: Cloudflare 排程與 secret
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/twstock/schedules" | python3 -c "import sys,json;d=json.load(sys.stdin);print('schedules:', d.get('success'), d.get('result'), d.get('errors'))"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/twstock/secrets" | python3 -c "import sys,json;d=json.load(sys.stdin);print('secrets:', d.get('success'), [s.get('name') for s in (d.get('result') or [])], d.get('errors'))"
      - name: GitHub 權杖能不能觸發
        run: |
          [ -n "$GH_DISPATCH_TOKEN" ] && echo "GH_DISPATCH_TOKEN 有值" || echo "GH_DISPATCH_TOKEN 是空的"
          curl -s -o /dev/null -w "token 檢查 HTTP %{http_code}\n" -H "Authorization: Bearer $GH_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/mingo-tw/taiwan-stock/actions/workflows/update.yml
