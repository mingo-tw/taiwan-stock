name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          for u in ["https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O", "https://openapi.twse.com.tw/v1/opendata/t187ap03_L"]:
              try:
                  j = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
                  print(u, len(j), list(j[0].keys()))
                  print([x for x in j if "6488" in x.values() or "2330" in x.values()][:1])
              except Exception as e:
                  print(u, "ERR", e)
          PY
